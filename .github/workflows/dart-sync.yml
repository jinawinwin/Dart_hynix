name: OpenDART data and dashboard

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "수집 시작연도"
        required: true
        default: "2010"
      to_year:
        description: "수집 종료연도"
        required: true
        default: "2026"
  schedule:
    # 매월 1일 00:15 UTC (한국시간 09:15)
    - cron: "15 0 1 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 범위 계산
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "from_year=${{ inputs.from_year }}" >> "$GITHUB_OUTPUT"
            echo "to_year=${{ inputs.to_year }}" >> "$GITHUB_OUTPUT"
          else
            echo "from_year=2010" >> "$GITHUB_OUTPUT"
            echo "to_year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          fi

      - name: 사업·반기·분기보고서 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: >-
          python -m src.main
          --from-year "${{ steps.range.outputs.from_year }}"
          --to-year "${{ steps.range.outputs.to_year }}"
          --all-reports
          --fs-div AUTO
          --continue-on-error

      - name: 정적 대시보드 데이터 생성
        run: python -m src.build_dashboard

      - name: 변경 데이터 커밋
        run: |
          git config user.name "financial-data-bot"
          git config user.email "financial-data-bot@users.noreply.github.com"
          git add data reports docs/dashboard-data.js
          git diff --cached --quiet && exit 0
          git commit -m "data: monthly OpenDART update"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
